name: Fetch Live Scores

on:
  schedule:
    # Every hour, on the hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab
  repository_dispatch:
    # Mirrors SlickDealsTracker's "trigger-deals-pull" pattern -- fire this
    # from anywhere (Apps Script, another workflow, curl) with:
    #   POST https://api.github.com/repos/mzaiger/FootballDashboard/dispatches
    #   { "event_type": "trigger-scores-pull" }
    types: [trigger-scores-pull]

# Own lock, separate from the dashboard build. Scores only write
# data/scores.json, so they never need to wait for the long dashboard run.
# (A newer pending run replaces an older pending one, which is fine here.)
concurrency:
  group: fetch-scores
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch scores.json
        run: python scripts/fetch_scores.py

      - name: Commit updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --staged --quiet && exit 0
          git commit -m "Update live scores [automated]"
          # The dashboard build may have pushed while we were fetching.
          # Rebase on top of it and retry instead of failing.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Push failed after 5 attempts" >&2
          exit 1
