name: Update Betting Dashboards

on:
  schedule:
    # Every 4 hours, on the hour (00:00/04:00/08:00/... UTC). GitHub
    # Actions cron is always UTC and doesn't shift with Central time's own
    # DST, so the actual Central-time hours this lands on drift by an hour
    # for part of the year -- still 6 evenly-spaced runs a day either way.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

concurrency:
  group: shared-repo-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build NCAAF ncaaf_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_ncaaf_dashboard.py

      - name: Build NFL nfl_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_nfl_dashboard.py

      - name: Build MLB mlb_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_mlb_dashboard.py

      - name: Build NBA nba_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_nba_dashboard.py

      - name: Build NCAAMB ncaamb_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_ncaamb_dashboard.py

      - name: Build NHL nhl_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_nhl_dashboard.py

      - name: Fill in team logos
        run: python scripts/add_team_logos.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ncaaf_dashboard.json data/nfl_dashboard.json data/mlb_dashboard.json data/nba_dashboard.json data/ncaamb_dashboard.json data/nhl_dashboard.json
          # Only exists once a Gemini call has actually happened (e.g. GEMINI_KEY
          # unset, or every game was already cached) -- don't fail the step over it.
          if [ -f data/gemini_predictions_cache.json ]; then
            git add data/gemini_predictions_cache.json
          fi
          git diff --staged --quiet || git commit -m "Update dashboard data [automated]"
          git push
